name: Refresh Publix BOGOs

on:
  schedule:
    # 11:00 UTC daily — early morning Eastern, after a new ad would be posted.
    # Daily rather than weekly so a one-off failure self-heals the next day.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      store:
        description: 'Publix store number (overrides the PUBLIX_STORE_NUMBER variable)'
        required: false
        type: string
      discover:
        description: 'Probe Publix endpoints and report what each returns, without changing the feed'
        required: false
        default: false
        type: boolean
      postal:
        description: 'ZIP code (discovery only) — lets the probe reach third-party circular platforms'
        required: false
        type: string

# Pages needs write + id-token, on top of contents:write for the feed commit.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-bogos
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # This job publishes the site itself (see the deploy step below), so it has
    # to declare the Pages environment.
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Report which settings the job can see
        env:
          V_POSTAL: ${{ vars.PUBLIX_POSTAL_CODE }}
          S_POSTAL: ${{ secrets.PUBLIX_POSTAL_CODE }}
          V_POSTAL_ALT: ${{ vars.PUBLIC_POSTAL_CODE }}
          V_STORE: ${{ vars.PUBLIX_STORE_NUMBER }}
        run: |
          # Report presence only, never the values.
          echo "PUBLIX_POSTAL_CODE  variable: ${V_POSTAL:+set}${V_POSTAL:-MISSING}"
          echo "PUBLIX_POSTAL_CODE  secret:   ${S_POSTAL:+set}${S_POSTAL:-missing}"
          echo "PUBLIC_POSTAL_CODE  variable: ${V_POSTAL_ALT:+set}${V_POSTAL_ALT:-missing}"
          echo "PUBLIX_STORE_NUMBER variable: ${V_STORE:+set}${V_STORE:-missing}"
          if [ -z "${V_POSTAL}${S_POSTAL}${V_POSTAL_ALT}" ]; then
            echo "::warning title=No postal code visible::The weekly-ad BOGOs will be skipped. Add a repository variable named PUBLIX_POSTAL_CODE under Settings → Secrets and variables → Actions → Variables."
          fi

      # Read-only reconnaissance: reports what every candidate endpoint returns
      # so the right one can be picked out of a single log, instead of one
      # guess per CI round trip. Writes nothing and deploys nothing.
      - name: Probe Publix endpoints
        if: ${{ inputs.discover }}
        env:
          PUBLIX_STORE_NUMBER: ${{ inputs.store || vars.PUBLIX_STORE_NUMBER || secrets.PUBLIX_STORE_NUMBER }}
          PUBLIX_POSTAL_CODE: ${{ inputs.postal || vars.PUBLIX_POSTAL_CODE || secrets.PUBLIX_POSTAL_CODE }}
          PUBLIC_POSTAL_CODE: ${{ vars.PUBLIC_POSTAL_CODE || secrets.PUBLIC_POSTAL_CODE }}
        run: node scripts/fetch-publix-bogos.mjs --discover

      # The script never exits non-zero for an unreachable feed: it records the
      # failed attempt in data/bogos.json and emits a CI warning, so a broken
      # endpoint does not send a failure email every single morning.
      - name: Fetch this week's BOGO deals
        if: ${{ !inputs.discover }}
        env:
          PUBLIX_STORE_NUMBER: ${{ inputs.store || vars.PUBLIX_STORE_NUMBER || secrets.PUBLIX_STORE_NUMBER }}
          # The weekly ad is keyed by postal code, not store number. Read from
          # both tabs, and tolerate the near-miss spelling.
          PUBLIX_POSTAL_CODE: ${{ inputs.postal || vars.PUBLIX_POSTAL_CODE || secrets.PUBLIX_POSTAL_CODE }}
          PUBLIC_POSTAL_CODE: ${{ vars.PUBLIC_POSTAL_CODE || secrets.PUBLIC_POSTAL_CODE }}
        run: node scripts/fetch-publix-bogos.mjs --out data/bogos.json

      - name: Commit if the feed changed
        id: commit
        if: ${{ !inputs.discover }}
        run: |
          if git diff --quiet -- data/bogos.json; then
            echo "No change to data/bogos.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bogos.json
          git commit -m "chore: refresh Publix BOGO feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN deliberately does not trigger
      # other workflows, so the Pages deploy never fires for the commit above.
      # The site would keep serving the previous feed indefinitely. Publish
      # from here instead, straight from the tree we just committed.
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish the refreshed feed
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

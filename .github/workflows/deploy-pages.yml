name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # The shared list is read through the GitHub API, never from the built
      # site, so a list edit does not need a redeploy. Without this, checking
      # items off in a store would burn through the Pages build allowance.
      - 'data/vault.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is plain HTML/CSS/ES modules — there is nothing to build.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
